<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory-Spiel: Töne und Bilder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2c3e50;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stats {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Contenedor principal de los tableros */
        .board-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 30px;
            perspective: 1000px;
        }

        /* Filas individuales para imágenes y sonidos */
        .board-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 130px;
            height: 130px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }

        .card:hover:not(.flipped):not(.matched) {
            transform: scale(1.05);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg) scale(0.95);
            animation: matchAnim 0.5s ease-in-out;
        }

        @keyframes matchAnim {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); box-shadow: 0 0 20px #2ecc71; }
            100% { transform: rotateY(180deg) scale(0.95); }
        }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .card-front {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
            font-size: 50px;
            font-weight: 800;
        }

        .card-back {
            background-color: white;
            transform: rotateY(180deg);
            border: 3px solid #fff;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .icon {
            font-size: 60px;
            color: #3498db;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .matched .card-back {
            border-color: #2ecc71;
            opacity: 0.8;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Responsive */
        @media (max-width: 800px) {
            .card { width: 110px; height: 110px; }
            .board-row { gap: 15px; }
            h1 { font-size: 2rem; }
        }
        @media (max-width: 600px) {
            .card { width: 90px; height: 90px; }
            .board-row { gap: 10px; }
        }
    </style>
</head>
<body>

    <h1>🧠 Sound & Bild Memory</h1>
    
    
    <div class="board-container">
        <!-- Fila de imágenes (arriba) -->
        <div class="board-row" id="image-board"></div>
        <!-- Fila de sonidos (abajo) -->
        <div class="board-row" id="audio-board"></div>
    </div>

    <button class="btn" onclick="restartGame()">Spiel Neu Starten</button>

    <script>
        // Separamos los datos en imágenes y audios
        const imagesData = [
            { type: 'image', file: 'papel.jpeg', id: 'papel' },
            { type: 'image', file: 'grifo.jpeg', id: 'grifo' },
            { type: 'image', file: 'hojas.jpeg', id: 'hojas' },
            { type: 'image', file: 'lego.jpeg', id: 'lego' },
            { type: 'image', file: 'sila.jpeg', id: 'silla' }
        ];

        const audiosData = [
            { type: 'audio', file: 'freesound_community-rasgando-periodico-89415.mp3', id: 'papel' },
            { type: 'audio', file: 'freesound_community-agua-73988.mp3', id: 'grifo' },
            { type: 'audio', file: 'sspsurvival-footsteps-on-dry-leaves-and-grass-332958.mp3', id: 'hojas' },
            { type: 'audio', file: 'freesound_community-lego-bricks-2-67681.mp3', id: 'lego' },
            { type: 'audio', file: 'freesound_community-wooden-chair-move-86869.mp3', id: 'silla' }
        ];

        let imageBoard = document.getElementById('image-board');
        let audioBoard = document.getElementById('audio-board');
        
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let currentAudio = null;
        
        let matches = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let gameStarted = false;

        function shuffle(array) {
            array.sort(() => Math.random() - 0.5);
        }

        // Función para crear el elemento HTML de la carta
        function createCardElement(data) {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card');
            cardElement.dataset.id = data.id;
            cardElement.dataset.type = data.type;
            cardElement.dataset.file = data.file;

            const frontFace = document.createElement('div');
            frontFace.classList.add('card-face', 'card-front');
            frontFace.innerText = '?';

            const backFace = document.createElement('div');
            backFace.classList.add('card-face', 'card-back');

            if (data.type === 'image') {
                const imgElement = document.createElement('img');
                imgElement.src = data.file;
                backFace.appendChild(imgElement);
            } else if (data.type === 'audio') {
                const iconElement = document.createElement('div');
                iconElement.classList.add('icon');
                iconElement.innerHTML = '🔊'; 
                backFace.appendChild(iconElement);
            }

            cardElement.appendChild(frontFace);
            cardElement.appendChild(backFace);
            cardElement.addEventListener('click', flipCard);
            
            return cardElement;
        }

        function initGame() {
            imageBoard.innerHTML = '';
            audioBoard.innerHTML = '';
            
            // Barajamos ambos grupos por separado
            shuffle(imagesData);
            shuffle(audiosData);
            
            // Renderizamos las imágenes en la fila superior
            imagesData.forEach(data => {
                imageBoard.appendChild(createCardElement(data));
            });

            // Renderizamos los audios en la fila inferior
            audiosData.forEach(data => {
                audioBoard.appendChild(createCardElement(data));
            });
        }

        function startTimer() {
            if (!gameStarted) {
                gameStarted = true;
                timerInterval = setInterval(() => {
                    timer++;
                    document.getElementById('time').innerText = timer;
                }, 1000);
            }
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            startTimer();
            this.classList.add('flipped');

            if (this.dataset.type === 'audio') {
                if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
                currentAudio = new Audio(this.dataset.file);
                currentAudio.play();
            }

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            moves++;
            document.getElementById('moves').innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            matches++;
            // Ganamos cuando el número de aciertos es igual a la cantidad de imágenes
            if (matches === imagesData.length) {
                winGame();
            }
            
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                if(currentAudio) { currentAudio.pause(); } 
                resetBoard();
            }, 1200); 
        }

        function resetBoard() {
            [firstCard, secondCard, lockBoard] = [null, null, false];
        }

        function winGame() {
            clearInterval(timerInterval);
            setTimeout(() => {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 }
                });
                alert(`Glückwunsch! Du hast in ${moves} Zügen und ${timer} Sekunden gewonnen!`);
            }, 500);
        }

        function restartGame() {
            matches = 0;
            moves = 0;
            timer = 0;
            gameStarted = false;
            document.getElementById('moves').innerText = moves;
            document.getElementById('time').innerText = timer;
            clearInterval(timerInterval);
            if(currentAudio) { currentAudio.pause(); }
            
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => card.classList.remove('flipped', 'matched'));
            
            setTimeout(() => {
                initGame();
            }, 600);
        }

        initGame();
    </script>
</body>
</html>
